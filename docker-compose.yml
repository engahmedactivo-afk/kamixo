# Local development stack: Postgres + API (+ admin CMS at http://localhost:3000/admin/).
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: kamixo
      POSTGRES_PASSWORD: kamixo
      POSTGRES_DB: kamixo
    ports: ["5432:5432"]
    volumes: [db:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kamixo"]
      interval: 3s
      retries: 20

  api:
    build: ./backend
    depends_on:
      db: { condition: service_healthy }
    ports: ["3000:3000"]
    environment:
      # NODE_ENV=development keeps the sandbox purchase verifier usable locally.
      NODE_ENV: development
      DATABASE_URL: postgresql://kamixo:kamixo@db:5432/kamixo?schema=public
      JWT_SECRET: dev-only-change-me
      ADMIN_API_KEY: dev-admin-key
      PURCHASE_VERIFIER: sandbox

volumes:
  db:
