<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kamixo Studio</title>
<style>
  :root { --bg:#0f0f14; --panel:#1a1a22; --line:#2c2c38; --text:#ececf1; --muted:#9a9aab; --accent:#ff3d71; --ok:#3ddc97; }
  * { box-sizing:border-box; } body { margin:0; font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--text); }
  header { display:flex; align-items:center; gap:16px; padding:12px 20px; border-bottom:1px solid var(--line); background:var(--panel); position:sticky; top:0; }
  header h1 { font-size:16px; margin:0; } header h1 span { color:var(--accent); }
  nav button { background:none; border:0; color:var(--muted); padding:6px 10px; cursor:pointer; font:inherit; border-radius:6px; } nav button.active { color:var(--text); background:var(--line); }
  main { max-width:1000px; margin:0 auto; padding:20px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:16px; margin-bottom:16px; }
  table { width:100%; border-collapse:collapse; } th, td { text-align:left; padding:8px; border-bottom:1px solid var(--line); vertical-align:middle; } th { color:var(--muted); font-weight:500; }
  input, select, textarea { width:100%; background:var(--bg); color:var(--text); border:1px solid var(--line); border-radius:6px; padding:7px 9px; font:inherit; }
  label { display:block; color:var(--muted); font-size:12px; margin:8px 0 4px; } .grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(180px,1fr)); gap:10px; }
  button.btn { background:var(--accent); color:#fff; border:0; padding:8px 14px; border-radius:6px; cursor:pointer; font:inherit; } button.ghost { background:var(--line); color:var(--text); border:0; padding:6px 10px; border-radius:6px; cursor:pointer; font:inherit; }
  .pill { display:inline-block; padding:2px 8px; border-radius:99px; font-size:12px; background:var(--line); } .pill.PUBLISHED, .pill.DONE { background:rgba(61,220,151,.15); color:var(--ok); } .pill.FAILED { background:rgba(255,61,113,.2); color:var(--accent); }
  .stats { display:grid; grid-template-columns:repeat(auto-fit, minmax(150px,1fr)); gap:12px; } .stat b { display:block; font-size:24px; } .stat span { color:var(--muted); }
  #toast { position:fixed; bottom:20px; right:20px; padding:10px 14px; border-radius:8px; background:var(--panel); border:1px solid var(--line); display:none; } progress { width:100%; }
</style>
</head>
<body>
<header>
  <h1>Kamixo <span>Studio</span></h1>
  <nav id="nav"><button data-view="series" class="active">My series</button><button data-view="jobs">Processing</button><button data-view="earnings">Earnings</button></nav>
  <div style="margin-left:auto;display:flex;gap:8px"><input id="key" type="password" placeholder="Studio key" style="width:220px"><button class="ghost" id="saveKey">Sign in</button></div>
</header>
<main id="app"></main>
<div id="toast"></div>
<script>
const $ = (s, r = document) => r.querySelector(s);
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
let key = ''; try { key = sessionStorage.getItem('kamixoStudioKey') || ''; } catch {}
$('#key').value = key;
$('#saveKey').onclick = () => { key = $('#key').value.trim(); try { sessionStorage.setItem('kamixoStudioKey', key); } catch {} render(); };
function toast(msg, bad) { const t = $('#toast'); t.textContent = msg; t.style.borderColor = bad ? 'var(--accent)' : 'var(--ok)'; t.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(() => (t.style.display = 'none'), 3500); }
async function api(method, path, body) {
  const res = await fetch('/studio' + path, { method, headers: { 'content-type': 'application/json', 'x-studio-key': key }, body: body ? JSON.stringify(body) : undefined });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(Array.isArray(data.message) ? data.message.join(', ') : data.message || res.statusText);
  return data;
}
let view = 'series';
$('#nav').onclick = (e) => { const v = e.target.dataset.view; if (!v) return; view = v; document.querySelectorAll('#nav button').forEach((b) => b.classList.toggle('active', b.dataset.view === v)); render(); };

async function render() {
  const app = $('#app');
  if (!key) { app.innerHTML = '<div class="card">Enter the studio key you received from Kamixo.</div>'; return; }
  try {
    const me = await api('GET', '/me');
    if (view === 'series') await renderSeries(app, me);
    if (view === 'jobs') await renderJobs(app);
    if (view === 'earnings') await renderEarnings(app, me);
  } catch (e) { app.innerHTML = `<div class="card">Error: ${esc(e.message)}</div>`; }
}

async function renderSeries(app, me) {
  const list = await api('GET', '/series');
  app.innerHTML = `
  <div class="card"><h3 style="margin-top:0">Welcome, ${esc(me.name)}</h3><p style="color:var(--muted);margin:0">Your revenue share is <b>${me.revenueSharePct}%</b> of coins spent on your episodes. New series start as drafts; Kamixo reviews and publishes them.</p></div>
  <div class="card"><h3 style="margin-top:0">New series</h3>
    <form id="newSeries"><div class="grid">
      <div><label>Title</label><input name="title" required></div>
      <div><label>Cover URL (9:16)</label><input name="coverUrl" required placeholder="https://…/cover.jpg"></div>
      <div><label>Genres (comma separated)</label><input name="genres" placeholder="Romance, CEO"></div>
      <div><label>Spoken language</label><select name="sourceLang">${['en','zh','es','pt','id','th','vi','ar','hi','tr','ko','ja','fr','de'].map((l) => `<option>${l}</option>`).join('')}</select></div>
    </div><label>Description</label><textarea name="description" rows="2"></textarea><p><button class="btn">Create series</button></p></form></div>
  ${list.map((s) => `<div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center"><h3 style="margin:0">${esc(s.title)} <span class="pill ${esc(s.status)}">${esc(s.status)}</span></h3><span style="color:var(--muted)">${s.viewCount} views</span></div>
    <table><thead><tr><th>#</th><th>Status</th><th>Subtitles</th><th>AI dubs</th><th>Coins earned</th></tr></thead><tbody>
      ${s.episodes.map((e) => `<tr><td>${e.number}</td><td>${e.ready ? '<span class="pill DONE">Ready</span>' : '<span class="pill">Processing…</span>'}</td><td>${esc(e.subtitles.join(', ') || '—')}</td><td>${esc(e.dubs.join(', ') || '—')}</td><td>${e.coinsEarned}</td></tr>`).join('') || '<tr><td colspan="5">No episodes yet.</td></tr>'}
    </tbody></table>
    <form class="upload" data-series="${esc(s.id)}" style="margin-top:10px"><div class="grid">
      <div><label>Episode number</label><input name="number" type="number" min="1" value="${(s.episodes.at(-1)?.number ?? 0) + 1}"></div>
      <div><label>Title (optional)</label><input name="title"></div>
      <div><label>Video file (mp4 / mov / mkv / webm, 9:16)</label><input name="file" type="file" accept="video/*" required></div>
    </div><p><button class="btn">Upload episode</button></p><progress class="hidden" value="0" max="100" style="display:none"></progress></form>
  </div>`).join('')}`;
  $('#newSeries').onsubmit = async (e) => {
    e.preventDefault(); const f = new FormData(e.target);
    try { await api('POST', '/series', { title: f.get('title'), coverUrl: f.get('coverUrl'), description: f.get('description'), sourceLang: f.get('sourceLang'), genres: String(f.get('genres')).split(',').map((g) => g.trim()).filter(Boolean) }); toast('Series created'); render(); }
    catch (err) { toast(err.message, true); }
  };
  app.querySelectorAll('form.upload').forEach((form) => (form.onsubmit = (e) => { e.preventDefault(); upload(form); }));
}

function upload(form) {
  const fd = new FormData(form);
  const bar = form.querySelector('progress'); bar.style.display = 'block';
  const xhr = new XMLHttpRequest();
  xhr.open('POST', `/studio/series/${form.dataset.series}/episodes/upload`);
  xhr.setRequestHeader('x-studio-key', key);
  xhr.upload.onprogress = (ev) => { if (ev.lengthComputable) bar.value = (ev.loaded / ev.total) * 100; };
  xhr.onload = () => {
    bar.style.display = 'none';
    if (xhr.status < 300) { toast('Uploaded. Transcoding has started.'); view = 'jobs'; document.querySelectorAll('#nav button').forEach((b) => b.classList.toggle('active', b.dataset.view === 'jobs')); render(); }
    else { let m = xhr.statusText; try { const d = JSON.parse(xhr.responseText); m = Array.isArray(d.message) ? d.message.join(', ') : d.message || m; } catch {} toast(m, true); }
  };
  xhr.onerror = () => { bar.style.display = 'none'; toast('Upload failed', true); };
  xhr.send(fd);
}

async function renderJobs(app) {
  const jobs = await api('GET', '/jobs');
  app.innerHTML = `<div class="card"><h3 style="margin-top:0">Processing</h3><p style="color:var(--muted)">Transcoding, subtitles and AI dubbing. This page refreshes every 5 seconds.</p>
    <table><thead><tr><th>When</th><th>Type</th><th>Status</th><th>Details</th></tr></thead><tbody>
    ${jobs.map((j) => `<tr><td>${esc(new Date(j.createdAt).toLocaleString())}</td><td>${esc(j.type)}</td><td><span class="pill ${esc(j.status)}">${esc(j.status)}</span></td><td style="color:var(--muted);font-size:12px">${esc(j.error || JSON.stringify(j.result))}</td></tr>`).join('') || '<tr><td colspan="4">Nothing in progress.</td></tr>'}
    </tbody></table></div>`;
  clearTimeout(renderJobs.t); renderJobs.t = setTimeout(() => { if (view === 'jobs') render(); }, 5000);
}

async function renderEarnings(app, me) {
  const month = (renderEarnings.month ||= new Date().toISOString().slice(0, 7));
  const e = await api('GET', `/earnings?month=${month}`);
  app.innerHTML = `<div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><h3 style="margin:0">Earnings</h3><input id="month" type="month" value="${esc(month)}" style="width:170px"></div>
    <div class="stats" style="margin-top:16px">
      <div class="stat"><b>${e.unlocks}</b><span>Episode unlocks</span></div><div class="stat"><b>${e.coins}</b><span>Coins spent</span></div>
      <div class="stat"><b>$${e.grossUsd.toFixed(2)}</b><span>Gross (${e.coinUsdValue}$/coin)</span></div><div class="stat"><b>$${e.payoutUsd.toFixed(2)}</b><span>Your payout (${e.revenueSharePct}%)</span></div>
    </div></div>
    <div class="card"><table><thead><tr><th>Series</th><th>Unlocks</th><th>Coins</th></tr></thead><tbody>
    ${e.series.map((s) => `<tr><td>${esc(s.title)}</td><td>${s.unlocks}</td><td>${s.coins}</td></tr>`).join('') || '<tr><td colspan="3">No unlocks this month.</td></tr>'}</tbody></table></div>`;
  $('#month').onchange = (ev) => { renderEarnings.month = ev.target.value; render(); };
}
render();
</script>
</body>
</html>
